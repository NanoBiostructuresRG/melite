name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "dev/v*"
      - "release/*"

jobs:
  static-analysis:
    name: Static analysis (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: python -m ruff check melite tests scripts

      - name: Run Mypy
        run: python -m mypy melite

  test-build-smoke:
    name: Test, build, and smoke install (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build twine

      - name: Run tests
        run: python -m pytest tests -p no:cacheprovider --basetemp .pytest_tmp

      - name: Check CLI version
        run: melite --version

      - name: Check public import boundary
        run: |
          python -c "
          import melite
          expected = ['Config', 'load_datasets', 'plot_f1_macro_evidence', 'predict', '__version__']
          assert melite.__all__ == expected, melite.__all__
          for name in expected:
              assert hasattr(melite, name), f'{name} missing'
          assert 'load_dataset' not in melite.__all__,     'load_dataset must not be top-level public API'
          assert 'ResultManager' not in melite.__all__,    'ResultManager must not be top-level public API'
          assert not hasattr(melite, 'Pipeline'),          'Pipeline must not be public'
          assert not hasattr(melite, '_load_toml'),        '_load_toml must not be public'
          from melite.result_manager import ResultManager
          assert ResultManager is not None,                'ResultManager internal import missing'
          print(melite.__version__, 'OK')
          "

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Smoke installed wheel toy workflow
        run: python scripts/smoke_install_wheel.py

      - name: Smoke install sdist
        shell: bash
        run: |
          set -euo pipefail
          SDIST="$(ls dist/*.tar.gz | head -n 1)"
          python -m venv .smoke_sdist_venv
          .smoke_sdist_venv/bin/python -m pip install --upgrade pip
          .smoke_sdist_venv/bin/python -m pip install "$SDIST"
          mkdir -p .smoke_sdist_outside
          cd .smoke_sdist_outside
          ../.smoke_sdist_venv/bin/melite --version
          ../.smoke_sdist_venv/bin/python -c "
          import melite
          expected = ['Config', 'load_datasets', 'plot_f1_macro_evidence', 'predict', '__version__']
          assert melite.__all__ == expected, melite.__all__
          for name in expected:
              assert hasattr(melite, name), f'{name} missing'
          assert 'load_dataset' not in melite.__all__,     'load_dataset must not be top-level public API'
          assert 'ResultManager' not in melite.__all__,    'ResultManager must not be top-level public API'
          from melite.result_manager import ResultManager
          assert ResultManager is not None,                'ResultManager internal import missing'
          print(melite.__version__, 'sdist OK')
          "

  docs-build:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"

      - name: Build MkDocs site
        run: mkdocs build --strict
