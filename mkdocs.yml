# SPDX-License-Identifier: LGPL-3.0-or-later
site_name: MELITE
site_description: Comparative classifier evaluation for reproducible model selection on numeric tabular data, with nested cross-validation and preserved evaluation evidence.
site_url: https://nanobiostructuresrg.github.io/melite/
repo_url: https://github.com/NanoBiostructuresRG/melite
repo_name: NanoBiostructuresRG/melite

theme:
  name: material
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra_css:
  - stylesheets/extra.css?v=0.2.4-docs

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/NanoBiostructuresRG/melite
      name: MELITE on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/melite/
      name: PyPI package melite
    - icon: fontawesome/solid/users
      link: https://nanobiostructuresrg.github.io/
      name: NanoBiostructuresRG

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: false
            show_root_toc_entry: false

nav:
  - Home: index.md
  - Usage: usage.md
  - API Reference: api.md
  - Decisions: decisions.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
