# MELITE synthetic numeric-tabular example
# Run from the directory containing melite_example/:
#   melite run --smoke --config melite_example/config.toml

[paths]
# Kept for legacy path compatibility; registered CSV datasets use their explicit path.
input   = "melite_example/data/"
dataset = "melite_example/data/"
output  = "melite_example/output/"

[benchmark]
random_state = 42

[datasets.sample_tabular]
path = "melite_example/data/sample_tabular.csv"
label_column = "label"
family = "tabular"
description = "Deterministic synthetic numeric tabular classification example with overlapping classes."

[cv]
n_splits = 3
n_repeats = 1
inner_n_splits = 3

[cv_smoke]
n_splits = 3
n_repeats = 1
inner_n_splits = 2

[classifiers]
active = ["svc"]
