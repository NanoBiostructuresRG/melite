# MELITE default configuration
# Copy this file and pass it with --config to override any of these values.
# Only the keys you include in your custom file will be overridden.

[paths]
input   = "raw/"
dataset = "data/"
output  = "output/"

[benchmark]
reduction_types = ["PCA", "UMAP"]
levels          = [70, 75, 80, 85, 90, 95]
random_state    = 42

[cv]
n_splits = 5
n_repeats = 3
inner_n_splits = 3

[cv_smoke]
n_splits = 3
n_repeats = 1
inner_n_splits = 2

[models]
# Active models to evaluate. Add "stack" to opt in to stacking.
active = ["svc", "rf", "xgb"]
