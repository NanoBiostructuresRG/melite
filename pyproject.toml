# SPDX-License-Identifier: LGPL-3.0-or-later
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "melite"
dynamic = ["version"]
description = "Tabular classification benchmarking toolkit for classifier selection, repeated stratified cross-validation, final model export, and artifact-based inference."
readme = "README.md"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE", "COPYING", "COPYING.LESSER"]
authors = [
    { name = "Flavio F. Contreras-Torres", email = "contreras.flavio@tec.mx" },
    { name = "Ana C. Murrieta", email = "ana.murrieta@tec.mx" }
]
keywords = [
    "machine learning",
    "benchmarking",
    "classification",
    "tabular data",
    "classifier selection",
    "cross-validation",
    "csv",
    "inference",
    "scikit-learn",
    "xgboost",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scikit-learn>=1.2",
    "xgboost>=1.7",
    "matplotlib>=3.6",
    "joblib>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build>=1.0",
    "hatchling>=1.18",
    "twine>=4.0",
    "ruff==0.16.4",
    "mypy==2.3.1",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[project.urls]
Homepage = "https://github.com/NanoBiostructuresRG/melite"
Repository = "https://github.com/NanoBiostructuresRG/melite"
Issues = "https://github.com/NanoBiostructuresRG/melite/issues"
Documentation = "https://nanobiostructuresrg.github.io/melite/"

[project.scripts]
melite = "melite.cli:main"

[tool.hatch.version]
path = "melite/version.py"

[tool.hatch.build.targets.wheel]
packages = ["melite"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.git",
    "/.github",
    "/.mypy_cache",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.tox",
    "/.venv",
    "/.*_venv",
    "/.review_venv",
    "/__pycache__",
    "*/__pycache__",
    "*.egg-info",
    "/*.egg-info",
    "/build",
    "/dist",
    "/docs",
    "/mkdocs.yml",
    # Leading "/" is intentional: exclude repository-root runtime directories,
    # not packaged resources such as melite/_example_assets/data/.
    "/data",
    "/raw",
    "/output",
    "/site",
    "/.review_site",
    "/.review_pytest_cache",
    "/.review_pytest_tmp",
    "/htmlcov",
    "/.coverage",
    "/tests_output.txt",
    "*.pyc",
    "*.pyo",
    "*.pkl",
    "*.joblib",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
tmp_path_retention_count = 0
tmp_path_retention_policy = "none"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F", "BLE001", "TID252"]
ignore = ["RUF022"]  # Preserve deliberate public API order in melite.__all__.

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# __init__.py is the package facade; explicit-relative imports make its local
# public re-exports deliberate and avoid self-qualified facade imports.
"melite/__init__.py" = ["TID252"]

[tool.mypy]
python_version = "3.11"
disable_error_code = ["import-untyped"]
