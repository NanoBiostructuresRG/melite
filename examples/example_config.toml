# MELITE example configuration
# Points to the synthetic example dataset included in the repository.
# Use this file to run a fast end-to-end benchmark for quickstart purposes.
#
# Usage:
#   melite run --smoke --config examples/example_config.toml

[paths]
input   = "examples/"
dataset = "examples/"
output  = "examples/output/"

[benchmark]
random_state    = 42

[datasets.sample_pca70]
path = "examples/sample_PCA70.npz"
label_path = "examples/sample_labels.npy"
family = "dimensionality"
method = "PCA"
level = 70
description = "Bundled synthetic PCA-style example dataset."

[cv]
n_splits  = 3
n_repeats = 1

[cv_smoke]
n_splits  = 3
n_repeats = 1

[classifiers]
active = ["svc"]
